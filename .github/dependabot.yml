version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    # `/` covers .github/workflows/*; the composite actions under
    # .github/actions/* (where pnpm/setup lives) are separate directories.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly

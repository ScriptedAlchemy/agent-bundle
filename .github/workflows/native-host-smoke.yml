name: Native host smoke

on:
  workflow_dispatch:
    inputs:
      host:
        description: Signed-in host CLI to exercise
        required: true
        default: both
        type: choice
        options: [both, claude, codex]

permissions:
  contents: read

concurrency:
  group: native-host-smoke-${{ github.workflow }}-${{ inputs.host }}
  cancel-in-progress: true

jobs:
  native-host-smoke:
    # This runs only on a trusted runner with existing CLI login state; no workflow secrets are passed.
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: claude
            suite: native-claude-contract
            test: packages/agent-bundle/tests/native-claude-contract.test.ts
          - host: claude
            suite: eval-claude-harness
            test: packages/agent-bundle/tests/eval-claude-harness.test.ts
          - host: codex
            suite: native-codex-contract
            test: packages/agent-bundle/tests/native-codex-contract.test.ts
          - host: codex
            suite: eval-codex-home
            test: packages/agent-bundle/tests/eval-codex-home.test.ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - name: ${{ matrix.host }} signed-in smoke (${{ matrix.suite }})
        if: inputs.host == 'both' || inputs.host == matrix.host
        env:
          AGENT_BUNDLE_NATIVE_CLAUDE_SMOKE: ${{ matrix.host == 'claude' && '1' || '' }}
          AGENT_BUNDLE_NATIVE_CODEX_SMOKE: ${{ matrix.host == 'codex' && '1' || '' }}
        run: npm run test -- ${{ matrix.test }}

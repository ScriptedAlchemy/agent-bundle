name: Package preview

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# Only the latest preview of a ref matters: a PR push cancels the superseded
# PR run and a main push cancels the superseded main run. A main commit that
# was overtaken before its preview published is not installable by SHA; the
# tip always is.
concurrency:
  group: package-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish pkg.pr.new preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 22.19.0
      - run: pnpm build
      - run: pnpm preview:publish

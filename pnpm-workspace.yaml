packages:
  - packages/*
  - packages/workbench/src/inspector
  - examples/*
  - website
# A published manifest must never carry a `workspace:` range (npm refuses to
# install such a tarball, and the release audit forbids it), so inter-package
# dependencies are written as plain ranges and satisfied from the workspace
# here: agent-bundle's optional @agent-bundle/runtime peer instead of a
# devDependency in the shipped package.json, and @agent-bundle/runtime's
# rsc-markdown-stream dependency instead of a registry fetch of the version
# this checkout is about to publish.
overrides:
  '@agent-bundle/runtime': workspace:*
  rsc-markdown-stream: workspace:*
peerDependencyRules:
  allowedVersions:
    'effect-rstest>@rstest/core': 0.11.10
allowBuilds:
  '@google/genai': false
  msgpackr-extract: false
  protobufjs: false
minimumReleaseAgeExclude:
  - '@rsbuild/core@2.2.1'
  - '@effect/tsgo-darwin-arm64@0.39.0'
  - '@effect/tsgo-darwin-x64@0.39.0'
  - '@effect/tsgo-linux-arm64@0.39.0'
  - '@effect/tsgo-linux-arm@0.39.0'
  - '@effect/tsgo-linux-x64@0.39.0'
  - '@effect/tsgo-win32-arm64@0.39.0'
  - '@effect/tsgo-win32-x64@0.39.0'
  - '@effect/tsgo@0.39.0'

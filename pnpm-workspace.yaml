packages:
  - packages/*
  - packages/workbench/src/inspector
  - examples/*
  - website
# agent-bundle declares @agent-bundle/runtime as an optional peer by plain
# range, not as a `workspace:` devDependency (npm refuses to install a tarball
# whose manifest still carries one, #183); this override satisfies that peer
# from the workspace. @agent-bundle/runtime's rsc-markdown-stream dependency
# needs no override: it is declared `workspace:^`, which `pnpm pack` and
# `pnpm publish` rewrite to the caret of the version being packed
# (packages/agent-bundle/tests/support/shared-pack.ts packs with pnpm for the
# same reason), and pkg-pr-new rewrites to the sibling preview URL.
overrides:
  '@agent-bundle/runtime': workspace:*
allowBuilds:
  '@google/genai': false
  msgpackr-extract: false
  protobufjs: false
minimumReleaseAgeExclude:
  - '@effect/tsgo-darwin-arm64@0.39.0'
  - '@effect/tsgo-darwin-x64@0.39.0'
  - '@effect/tsgo-linux-arm64@0.39.0'
  - '@effect/tsgo-linux-arm@0.39.0'
  - '@effect/tsgo-linux-x64@0.39.0'
  - '@effect/tsgo-win32-arm64@0.39.0'
  - '@effect/tsgo-win32-x64@0.39.0'
  - '@effect/tsgo@0.39.0'
# LocalProvider.init() awaits FlexSearch addAsync so the first search query
# cannot race the index build (#590; upstream web-infra-dev/rspress#3658).
# Drop the patch once a release awaits the adds.
patchedDependencies:
  '@rspress/core@2.0.21': patches/@rspress__core@2.0.21.patch

packages:
  - packages/*
  - packages/workbench/src/inspector
  - examples/*
  - website
# Allow explicitly authorized package versions without the waiting period.
minimumReleaseAgeExclude:
  - '@effect/tsgo@0.69.0'
  - '@effect/tsgo-darwin-arm64@0.69.0'
  - '@effect/tsgo-darwin-x64@0.69.0'
  - '@effect/tsgo-linux-arm@0.69.0'
  - '@effect/tsgo-linux-arm64@0.69.0'
  - '@effect/tsgo-linux-x64@0.69.0'
  - '@effect/tsgo-win32-arm64@0.69.0'
  - '@effect/tsgo-win32-x64@0.69.0'
  - flare-redact@1.9.0
# agent-bundle declares @agent-bundle/runtime as an optional peer by plain
# range, not as a `workspace:` devDependency (npm refuses to install a tarball
# whose manifest still carries one, #183); this override satisfies that peer
# from the workspace. @agent-bundle/runtime's rsc-markdown-stream dependency
# needs no override: it is declared `workspace:^`, which `pnpm pack` and
# `pnpm publish` rewrite to the caret of the version being packed
# (packages/agent-bundle/tests/support/shared-pack.ts packs with pnpm for the
# same reason), and pkg-pr-new rewrites to the sibling preview URL.
overrides:
  '@agent-bundle/runtime': workspace:*
  '@rspress/plugin-twoslash>typescript': npm:typescript@6.0.3
  '@rspress/plugin-typedoc>typescript': npm:typescript@6.0.3
  '@shikijs/twoslash>typescript': npm:typescript@6.0.3
  'twoslash>typescript': npm:typescript@6.0.3
  'typedoc>typescript': npm:typescript@6.0.3
allowBuilds:
  '@google/genai': false
  protobufjs: false
patchedDependencies:
  # The pinned preview still imports the Arbitrary path removed in Effect 4.0.0.
  effect-rstest@0.1.0: patches/effect-rstest@0.1.0.patch

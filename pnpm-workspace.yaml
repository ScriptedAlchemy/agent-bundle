packages:
  - packages/*
  - packages/workbench/src/inspector
  - examples/*
# The published agent-bundle manifest must never carry a `workspace:` range
# (npm refuses to install such a tarball, and the release audit forbids it),
# so its optional @agent-bundle/runtime peer is satisfied from the workspace
# here instead of through a devDependency in the shipped package.json.
overrides:
  '@agent-bundle/runtime': workspace:*
peerDependencyRules:
  allowedVersions:
    'effect-rstest>@rstest/core': 0.11.10
allowBuilds:
  '@google/genai': false
  msgpackr-extract: false
  protobufjs: false
minimumReleaseAgeExclude:
  - '@rsbuild/core@2.2.1'
  - '@effect/tsgo-darwin-arm64@0.39.0'
  - '@effect/tsgo-darwin-x64@0.39.0'
  - '@effect/tsgo-linux-arm64@0.39.0'
  - '@effect/tsgo-linux-arm@0.39.0'
  - '@effect/tsgo-linux-x64@0.39.0'
  - '@effect/tsgo-win32-arm64@0.39.0'
  - '@effect/tsgo-win32-x64@0.39.0'
  - '@effect/tsgo@0.39.0'
